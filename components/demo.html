<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo · cartel-evento</title>
<style>
  body{
    margin:0; padding:40px 20px; background:#111; color:#0f0;
    font-family:"Comic Sans MS", cursive; display:flex; flex-direction:column; gap:50px; align-items:center;
  }
  h2{ color:#0f0; }
  .col{ width:100%; max-width:1200px; display:flex; flex-direction:column; gap:14px; align-items:center; }
</style>
<script src="cartel-evento.js"></script>
</head>
<body>

  <div class="col">
    <h2>Default — títulos y textos con más presencia</h2>
    <cartel-evento></cartel-evento>
  </div>

  <div class="col">
    <h2>Título de la feria con imagen (clip-png) en vez de texto</h2>
    <cartel-evento poster="feria" feria-title-img="san-francisco.png"></cartel-evento>
  </div>

  <div class="col">
    <h2>body-img con versión distinta para mobile (landscape) — angostá la ventana para verla</h2>
    <cartel-evento
      card2-body-img="san-francisco.png"
      card2-body-img-mobile="iglesia.png">
    </cartel-evento>
  </div>

</body>
</html>
