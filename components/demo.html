<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo · cartel-evento</title>
<style>
  body{
    margin:0; padding:40px 20px; background:#111; color:#0f0;
    font-family:"Comic Sans MS", cursive; display:flex; flex-direction:column; gap:50px; align-items:center;
  }
  h2{ color:#0f0; }
  .col{ width:100%; max-width:1200px; display:flex; flex-direction:column; gap:14px; align-items:center; }
</style>
<script src="cartel-evento.js"></script>
</head>
<body>

  <div class="col">
    <h2>Default — texto largo en Misa, ya no se corta</h2>
    <cartel-evento card1-text="Comenzamos juntos celebrando a nuestro querido San Francisco de Asís en la parroquia a las 11hs."></cartel-evento>
  </div>

  <div class="col">
    <h2>Título del poster principal con imagen (sin píldora de fecha), ancho controlado</h2>
    <cartel-evento main-title-img="san-francisco.png" main-title-img-width="180px"></cartel-evento>
  </div>

  <div class="col">
    <h2>Título de la feria con imagen (sin píldora de fecha), ancho controlado</h2>
    <cartel-evento poster="feria" feria-title-img="san-francisco.png" feria-title-img-width="160px"></cartel-evento>
  </div>

</body>
</html>
